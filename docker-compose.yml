version: '3.8'

services:
  # MySQL Database - Using port 3308 to avoid conflicts
  db:
    image: mysql:8.2
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ralph_ng
      MYSQL_ROOT_PASSWORD: ralph_ng
      MYSQL_USER: ralph_ng
      MYSQL_PASSWORD: ralph_ng
    volumes:
      - ralph_dbdata:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # Ralph Application
  web:
    image: mostakimidlc/ralph:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8086:8000"
    volumes:
      - ralph_media:/var/local/ralph/media
      - ralph_static:/usr/share/ralph/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_NAME: ralph_ng
      DATABASE_USER: ralph_ng
      DATABASE_PASSWORD: ralph_ng
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PASSWORD: ""
      REDIS_PORT: 6379
      REDIS_DB: 0
      
      # Ralph Settings
      RALPH_DEBUG: "1"
      SECRET_KEY: "change-me-in-production"
      ALLOWED_HOSTS: "*"
      
      # Superuser credentials (optional)
      RALPH_SUPERUSER_USERNAME: admin
      RALPH_SUPERUSER_PASSWORD: admin
      RALPH_SUPERUSER_EMAIL: admin@example.com

  # Nginx for static files (optional, but recommended for production)
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - ralph_static:/usr/share/nginx/html/static:ro
      - ralph_media:/usr/share/nginx/html/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  ralph_dbdata:
    driver: local
  ralph_media:
    driver: local
  ralph_static:
    driver: local
